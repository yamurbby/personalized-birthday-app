<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Oda render aracı</title>
<style>
  body { margin: 0; background: #222; color: #eee; font: 14px sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; top: 8px; left: 8px; background: #000a; padding: 8px; border-radius: 8px; }
</style>
</head>
<body>
<div id="ui">yükleniyor…</div>
<script type="module">
// Geliştirme aracı: FBX odayı yükler, sabit kameradan render alır.
// window.setView({...}) ile kamera ayarlanır, window.snap() PNG data URL döndürür.
import * as THREE from 'three';
import { FBXLoader } from 'three/examples/jsm/loaders/FBXLoader.js';

const W = 1080, H = 1700;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.domElement.style.width = (W / 3) + 'px';
renderer.domElement.style.height = (H / 3) + 'px';
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, W / H, 0.01, 10000);

// ?m=charite gibi bir parametreyle başka model açılır
const MODELS = {
  'pink-bedroom': { fbx: '/art-src/pink-bedroom/source/pink.fbx', textures: '/art-src/pink-bedroom/textures/' },
  charite: { fbx: '/art-src/charite/OP_Mitte.fbx', textures: '/art-src/charite/', ext: 'jpg' },
};
const model = MODELS[new URLSearchParams(location.search).get('m') ?? 'pink-bedroom'];
const base = model.textures;
const manager = new THREE.LoadingManager();
manager.setURLModifier((url) => {
  if (/\.(png|jpe?g)$/i.test(decodeURIComponent(url))) {
    let name = decodeURIComponent(url).split(/[\\/]/).pop();
    if (model.ext) name = name.replace(/\.\w+$/, '.' + model.ext); // FBX'in beklediği uzantı dosyadakiyle farklıysa
    return base + encodeURIComponent(name);
  }
  return url;
});

const ui = document.getElementById('ui');
const info = { meshes: [], box: null };

new FBXLoader(manager).load(model.fbx, (obj) => {
  // Işık dokulara işlenmiş: ışıksız (basic) malzeme ile çiz
  obj.traverse((o) => {
    if (o.isMesh) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      const next = mats.map((m) => {
        if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
        return new THREE.MeshBasicMaterial({
          map: m.map || null,
          color: m.map ? 0xffffff : (m.color || 0xffffff),
          transparent: !!m.transparent, alphaTest: m.alphaTest || 0, side: THREE.DoubleSide,
        });
      });
      o.material = Array.isArray(o.material) ? next : next[0];
      info.meshes.push({ name: o.name, maps: mats.map((m) => m.map?.image?.src?.split('/').pop() ?? null) });
    }
  });
  scene.add(obj);
  const box = new THREE.Box3().setFromObject(obj);
  info.box = { min: box.min.toArray(), max: box.max.toArray() };
  window.obj = obj;
  window.setView({});
  ui.textContent = 'hazır';
  window.ready = true;
}, undefined, (e) => { ui.textContent = 'hata: ' + e; window.loadError = String(e); });

/** az/el: derece, dist: kutu boyutuna oranla, fov, target: kutu içi oran [0..1]^3 */
window.setView = ({ az = 45, el = 25, dist = 1.2, fov = 35, target = [0.5, 0.4, 0.5] } = {}) => {
  const b = new THREE.Box3().setFromObject(window.obj);
  const size = b.getSize(new THREE.Vector3());
  const t = new THREE.Vector3(
    b.min.x + size.x * target[0], b.min.y + size.y * target[1], b.min.z + size.z * target[2]);
  const r = size.length() * dist;
  const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);
  camera.fov = fov;
  camera.position.set(t.x + r * Math.cos(e) * Math.sin(a), t.y + r * Math.sin(e), t.z + r * Math.cos(e) * Math.cos(a));
  camera.near = r / 100; camera.far = r * 10;
  camera.lookAt(t);
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
};
/** Kamerayı doğrudan konumla: pos ve hedef dünya koordinatında.
 *  Oyundaki oda (src/assets/theme/room-pink.webp) bu açıyla çekildi:
 *  setCam([-70, 230, 620], [-70, 150, -300], 62)  — ayna 0xcfd8e3, tavan 0xf7e4e9 */
window.setCam = (pos, tgt, fov = 50) => {
  camera.fov = fov;
  camera.position.set(...pos);
  camera.near = 1; camera.far = 20000;
  camera.lookAt(new THREE.Vector3(...tgt));
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
};
window.hide = (...names) => { names.forEach((n) => { const o = window.obj.getObjectByName(n); if (o) o.visible = false; }); renderer.render(scene, camera); };
/** Küçük önizleme (JPEG data URL) */
window.preview = (w = 360) => {
  renderer.render(scene, camera);
  const c = document.createElement('canvas'); c.width = w; c.height = Math.round(w * H / W);
  c.getContext('2d').drawImage(renderer.domElement, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.8);
};
/** Diske kaydet (dev sunucusu art-src/renders/ içine yazar). w verilirse küçültür. */
window.save = async (name, w) => {
  renderer.render(scene, camera);
  let canvas = renderer.domElement;
  if (w) {
    canvas = document.createElement('canvas'); canvas.width = w; canvas.height = Math.round(w * H / W);
    canvas.getContext('2d').drawImage(renderer.domElement, 0, 0, canvas.width, canvas.height);
  }
  const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
  return (await fetch('/__save?name=' + name, { method: 'POST', body: blob })).text();
};
window.snap = () => { renderer.render(scene, camera); return renderer.domElement.toDataURL('image/png'); };
window.info = info;
</script>
</body>
</html>
